<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <style>
    .bg { fill: #f7f9fb; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
    .title { font: 700 18px Arial, sans-serif; fill: #111827; }
    .text { font: 14px Arial, sans-serif; fill: #374151; }
    .line { stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
    .label { font: 13px Arial, sans-serif; fill: #111827; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="760"/>
  <text class="title" x="370" y="42">Diagrama de Classes - Carona Universitaria</text>

  <rect class="box" x="70" y="95" width="280" height="210"/>
  <text class="title" x="92" y="128">Estudante</text>
  <text class="text" x="92" y="160">+ id</text>
  <text class="text" x="92" y="182">+ nome</text>
  <text class="text" x="92" y="204">+ telefone</text>
  <text class="text" x="92" y="226">+ cpf</text>
  <text class="text" x="92" y="248">+ rgm</text>
  <text class="text" x="92" y="270">+ email</text>
  <text class="text" x="210" y="160">+ senha</text>
  <text class="text" x="210" y="182">+ instituicao</text>
  <text class="text" x="210" y="204">+ curso</text>
  <text class="text" x="210" y="226">+ periodo</text>
  <text class="text" x="210" y="248">+ verificado</text>
  <text class="text" x="210" y="270">+ ativo</text>

  <rect class="box" x="685" y="95" width="330" height="245"/>
  <text class="title" x="707" y="128">Carona</text>
  <text class="text" x="707" y="160">+ id</text>
  <text class="text" x="707" y="182">+ motorista_id</text>
  <text class="text" x="707" y="204">+ endereco_inicio</text>
  <text class="text" x="707" y="226">+ endereco_destino</text>
  <text class="text" x="707" y="248">+ horario_partida</text>
  <text class="text" x="707" y="270">+ valor_total</text>
  <text class="text" x="855" y="160">+ vagas</text>
  <text class="text" x="855" y="182">+ status</text>
  <text class="text" x="855" y="204">+ recorrente</text>
  <text class="text" x="855" y="226">+ observacoes</text>
  <text class="text" x="855" y="248">+ finalizada_em</text>

  <rect class="box" x="390" y="420" width="330" height="190"/>
  <text class="title" x="412" y="453">CaronaParticipante</text>
  <text class="text" x="412" y="485">+ id</text>
  <text class="text" x="412" y="507">+ carona_id</text>
  <text class="text" x="412" y="529">+ estudante_id</text>
  <text class="text" x="412" y="551">+ valor</text>
  <text class="text" x="412" y="573">+ confirmado_em</text>
  <text class="text" x="570" y="485">+ status</text>
  <text class="text" x="570" y="507">+ created_at</text>

  <rect class="box" x="70" y="470" width="280" height="175"/>
  <text class="title" x="92" y="503">Avaliacao</text>
  <text class="text" x="92" y="535">+ id</text>
  <text class="text" x="92" y="557">+ avaliador_id</text>
  <text class="text" x="92" y="579">+ avaliado_id</text>
  <text class="text" x="92" y="601">+ carona_id</text>
  <text class="text" x="220" y="535">+ nota</text>
  <text class="text" x="220" y="557">+ comentario</text>
  <text class="text" x="220" y="579">+ created_at</text>

  <rect class="box" x="770" y="470" width="280" height="175"/>
  <text class="title" x="792" y="503">Auth</text>
  <text class="text" x="792" y="535">+ login(email, senha)</text>
  <text class="text" x="792" y="557">+ register(dados)</text>
  <text class="text" x="792" y="579">+ me(token)</text>
  <text class="text" x="792" y="601">+ gerarTokenJWT()</text>

  <line class="line" x1="350" y1="185" x2="685" y2="185"/>
  <text class="label" x="470" y="170">1 estudante cria N caronas</text>

  <line class="line" x1="765" y1="340" x2="635" y2="420"/>
  <text class="label" x="710" y="390">1 carona possui N participantes</text>

  <line class="line" x1="350" y1="285" x2="485" y2="420"/>
  <text class="label" x="370" y="365">1 estudante participa de N caronas</text>

  <line class="line" x1="210" y1="305" x2="210" y2="470"/>
  <text class="label" x="225" y="390">estudante avalia/recebe avaliacao</text>

  <line class="line" x1="350" y1="545" x2="390" y2="545"/>
  <text class="label" x="270" y="668">avaliacao vinculada a uma carona e a estudantes</text>

  <line class="line" x1="770" y1="555" x2="350" y2="215"/>
  <text class="label" x="520" y="680">Auth autentica estudantes e emite JWT</text>
</svg>
